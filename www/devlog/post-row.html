<li class="border-b border-rule py-8">
  <article aria-labelledby="post-@post-slug@">
    <p class="text-base tracking-body text-muted"><time datetime="@post-date@">@post-date-text@</time><span aria-hidden="true"> · </span>@post-topic@</p>

    <h3 id="post-@post-slug@" class="mt-2 text-xl leading-snug font-semibold tracking-body text-foreground"
      ><a href="/devlog/@post-slug@" class="underline underline-offset-4 hover:text-accent-text">@post-title@</a></h3
    >

    <p class="mt-3 text-lg text-muted">@post-summary@</p>
  </article>
</li>
